<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUMIO SALON</title>
  <meta name="description" content="Çok ustalı salonlar için randevu, kasa, stok ve ekip yönetimi.">
  <meta name="theme-color" content="#0a0e17">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LUMIO SALON">
  <script>
    /* Tema ve yazı boyutunu sayfa çizilmeden uygula (js/tema.js ile aynı kural) */
    (function () { try {
      var t = localStorage.getItem('lumio_tema') || 'koyu', y = { kucuk: 15, normal: 16, buyuk: 18, cokbuyuk: 20 }[localStorage.getItem('lumio_yazi') || 'normal'] || 16;
      var acik = t === 'acik' || (t === 'sistem' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.tema = acik ? 'acik' : 'koyu'; document.documentElement.style.setProperty('--yazi-boyu', y + 'px');
    } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="uygulama"><p class="yukleniyor">LUMIO SALON yükleniyor…</p></div>
  <noscript>Bu uygulama için JavaScript açık olmalı.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
